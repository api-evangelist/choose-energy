aid: choose-energy
name: Choose Energy
description: 'Choose Energy is a free online energy marketplace, founded in 2008 and
  operated by Red Ventures, that helps consumers and businesses in deregulated U.S.
  energy markets compare electricity and natural gas plans, view transparent all-inclusive
  pricing, and switch providers online in minutes. The platform serves customers across
  Texas, Pennsylvania, Ohio, Illinois, New Jersey, New York, Maryland, Massachusetts,
  Connecticut, and other deregulated states, and also offers solar cost estimation,
  business energy procurement, and educational energy resources. Choose Energy is a
  consumer-facing web marketplace and does not publish a public developer API.'
